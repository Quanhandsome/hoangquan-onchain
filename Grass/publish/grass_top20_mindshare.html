function plotLine(key) {

  const trace = {
    type: "scatter",
    mode: "lines",
    x: s.dates,
    y: s.values,
    name: title

  const layout = {
    title: title,
    margin: {t: 45, l: 60, r: 20, b: 45},
    xaxis: {title: "Date"},
    yaxis: {title: "Balance (Token Units)"},
  };
