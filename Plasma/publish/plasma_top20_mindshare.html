  const trace = {
    type: "scatter",

    x: s.dates,
    y: s.values,
    name: title

  const layout = {
    title: title,
    margin: {t: 45, l: 60, r: 20, b: 45},

    yaxis: {title: "Balance (Token Units)"},
  };
