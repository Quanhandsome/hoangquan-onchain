  const title = (key === "__OTHERS__") ? "Others (Users)" :
                (key === "__SUPPLY__") ? "TOTAL Supply (Users)" :
                ("Wallet: " + key);

  const trace = {
    type: "scatter",
    mode: "lines",
    x: s.dates,
    y: s.values,
    name: title
  };

  const layout = {
    title: title,
    margin: {t: 45, l: 60, r: 20, b: 45},
    xaxis: {title: "Date"},
    yaxis: {title: "Balance (Token Units)"},
  };

  Plotly.react("line", [trace], layout, {displayModeBar: true});
}

plotLine("0xda2ba36c37b9a9bf467ff599c7a1def859872bd8");

const treemapDiv = document.getElementById("treemap");
treemapDiv.on('plotly_click', function(ev) {
  if (!ev || !ev.points || !ev.points.length) return;
  const key = ev.points[0].customdata;
  plotLine(key);
});
</script>
