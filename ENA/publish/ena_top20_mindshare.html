const treemapLayout = {
  margin: {t: 10, l: 10, r: 10, b: 10},
};

Plotly.newPlot("treemap", [TREEMAP], treemapLayout, {displayModeBar: true});

function plotLine(key) {
  const s = SERIES[key] || SERIES["__OTHERS__"];
  const title = (key === "__OTHERS__") ? "Others (Users)" :
                (key === "__SUPPLY__") ? "TOTAL Supply (Users)" :
                ("Wallet: " + key);

  const trace = {
    type: "scatter",
    mode: "lines",
    x: s.dates,
    y: s.values,
    name: title
  };

  const layout = {
    title: title,
    margin: {t: 45, l: 60, r: 20, b: 45},
    xaxis: {title: "Date"},
    yaxis: {title: "Balance (Token Units)"},
  };

  Plotly.react("line", [trace], layout, {displayModeBar: true});
}

plotLine("0xa55457e0d0652ba47fe1f97873a62b4f9dcae4d1");

const treemapDiv = document.getElementById("treemap");
treemapDiv.on('plotly_click', function(ev) {
  if (!ev || !ev.points || !ev.points.length) return;
  const key = ev.points[0].customdata;
  plotLine(key);
});
</script>
